<style>
* { margin:0; padding:0; box-sizing:border-box; }

.container { max-width:1200px; margin:0 auto; padding:0 16px; }

.main-nav > .container > ul > li > a { display:block; color:#ddd; padding:12px 20px; font-size:14px; transition:.2s; }
.main-nav > .container > ul > li > a:hover { background:#e63946; color:#fff; }

.main-nav li:hover .submenu { display:block; }
.submenu a { display:block; padding:10px 18px; color:#333; font-size:13px; border-bottom:1px solid #f0f0f0; }
.submenu a:hover { background:#f5f5f7; color:#e63946; }

.hero-slide p { margin-bottom:20px; opacity:.85; font-size:15px; }

.product-card .info { padding:12px; display:flex; flex-direction:column; gap:5px; flex:1; }
.product-card .brand { font-size:11px; color:#999; }

    <div class="product-card">
      ${badgeLabel ? `<span class="${badgeClass}">${badgeLabel}</span>` : (p.oldPrice ? '<span class="badge">تخفیف</span>' : '')}
      <div class="img-wrapper" onclick="showPage('product',${p.id})">
        <img src="${getRealImage(p.name, p.id)}" alt="${p.name}" loading="lazy" onerror="this.src='https://loremflickr.com/400/400/perfume,bottle?lock=1'">
      </div>
      <div class="info">
        <span class="brand">${p.brand}</span>
        <span class="name" onclick="showPage('product',${p.id})">${p.name}</span>
        <div class="price-row">
          <span class="price">${fmt(p.price)}</span>
          ${p.oldPrice ? `<span class="old-price">${fmt(p.oldPrice)}</span>` : ''}
        </div>
        <button class="add-btn" onclick="addToCart(${p.id})">افزودن به سبد</button>
      </div>
    </div>`;
}

let currentFilter = 'all';

function showPage(page, param) {
  const app = document.getElementById('app');
  currentFilter = 'all';
  if (page === 'home') {
    app.innerHTML = `
      <section class="hero"><div class="container"><div class="hero-slide">
        <h1>عطر خودت را پیدا کن</h1>
        <p>کلاسیک یا عربی؟ انتخاب با شماست</p>
        <button class="btn-primary" onclick="showPage('products')">مشاهده محصولات</button>
      </div></div></section>
      <section class="section"><div class="container">
        <h2 class="section-title">پرفروش‌ترین‌ها</h2>
        <div class="product-grid">${products.filter(p=>p.bestSeller).slice(0,8).map(productCard).join('')}</div>
      </div></section>
      <section class="section"><div class="container">
        <h2 class="section-title">جدیدترین‌ها</h2>
        <div class="product-grid">${products.filter(p=>p.isNew).slice(0,8).map(productCard).join('')}</div>
      </div></section>`;
  } else if (page === 'products') {
    renderProductList(param || 'all');
  } else if (page === 'product') {
    const p = products.find(x=>x.id===param) || products[0];
    let genderLabel = p.gender === 'men' ? 'مردانه' : (p.gender === 'women' ? 'زنانه' : 'یونیسکس');
    let originLabel = p.origin === 'arabic' ? 'عربی' : 'کلاسیک / غیرعربی';
    
    app.innerHTML = `<section class="section"><div class="container">
      <div class="detail-grid">
        <div class="img-wrapper">
          <img src="${getRealImage(p.name, p.id)}" alt="${p.name}" onerror="this.src='https://loremflickr.com/400/400/perfume,bottle?lock=1'">
        </div>
        <div class="detail-info">
          <span class="brand">${p.brand}</span>
          <h1>${p.name}</h1>
          <div class="tags">
            <span class="tag gender">${genderLabel}</span>
            <span class="tag">${originLabel}</span>
          </div>
          <p class="rating">⭐ ${p.rating} از ۵</p>
          <div class="price-row" style="margin:10px 0;"><span class="price">${fmt(p.price)}</span>${p.oldPrice ? `<span class="old-price" style="color:#bbb;text-decoration:line-through;font-size:14px;margin-right:8px">${fmt(p.oldPrice)}</span>` : ''}</div>
          
          <p class="desc"><strong>توضیحات:</strong> ${p.desc}</p>
          
          <div class="notes">
            <strong>نت‌های بویایی:</strong>
            ${p.notes}
          </div>
          
          <button class="btn-primary" onclick="addToCart(${p.id})">افزودن به سبد خرید</button>
        </div>
      </div>
    </div></section>`;
  } else if (page === 'cart') {
    renderCart();
  }
  updateCartCount();
  window.scrollTo(0,0);
}

function renderProductList(filter) {
  const app = document.getElementById('app');
  let list = products;
  let title = 'همه محصولات';
  let showOriginFilter = false;

  if (filter === 'men') { list = products.filter(p=>p.gender==='men'); title = 'عطر مردانه'; showOriginFilter = true; }
  else if (filter === 'women') { list = products.filter(p=>p.gender==='women'); title = 'عطر زنانه'; showOriginFilter = true; }
  else if (filter === 'unisex') { list = products.filter(p=>p.gender==='unisex'); title = 'یونیسکس'; }
  else if (filter === 'men-classic') { list = products.filter(p=>p.gender==='men' && p.origin==='classic'); title = 'عطر مردانه کلاسیک'; }
  else if (filter === 'men-arabic') { list = products.filter(p=>p.gender==='men' && p.origin==='arabic'); title = 'عطر مردانه عربی'; }
  else if (filter === 'women-classic') { list = products.filter(p=>p.gender==='women' && p.origin==='classic'); title = 'عطر زنانه کلاسیک'; }
  else if (filter === 'women-arabic') { list = products.filter(p=>p.gender==='women' && p.origin==='arabic'); title = 'عطر زنانه عربی'; }

  let filterBar = '';
  if (showOriginFilter && !filter.includes('-')) {
    filterBar = `<div class="filter-bar">
      <button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="applyFilter('all','${filter}')">همه</button>
      <button class="filter-btn ${currentFilter==='classic'?'active':''}" onclick="applyFilter('classic','${filter}')">کلاسیک / غیرعربی</button>
      <button class="filter-btn ${currentFilter==='arabic'?'active':''}" onclick="applyFilter('arabic','${filter}')">عطر عربی</button>
    </div>`;
    if (currentFilter !== 'all') {
      list = list.filter(p => p.origin === currentFilter);
    }
  }

  app.innerHTML = `<section class="section"><div class="container">
    <h2 class="section-title">${title}</h2>
    ${filterBar}
    <div class="product-grid">${list.length ? list.map(productCard).join('') : '<p class="empty">محصولی یافت نشد</p>'}</div>
  </div></section>`;
}

function applyFilter(f, gender) {
  currentFilter = f;
  renderProductList(gender);
}

function renderCart() {
  const app = document.getElementById('app');
  const cart = getCart();
  if (!cart.length) {
    app.innerHTML = `<section class="section"><div class="container"><h2 class="section-title">سبد خرید</h2><div id="cart-box"><p class="empty">سبد خرید شما خالی است 🛍️</p></div></div></section>`;
    return;
  }
  let total = 0;
  const items = cart.map(item => {
    const p = products.find(x=>x.id===item.id);
    if (!p) return '';
    total += p.price * item.qty;
    return `<div class="cart-item">
      <div class="img-wrapper"><img src="${getRealImage(p.name, p.id)}" onerror="this.src='https://loremflickr.com/400/400/perfume,bottle?lock=1'"></div>
      <div class="cart-item-info"><strong>${p.name}</strong><span>${fmt(p.price)}</span></div>
      <div class="qty-control"><button onclick="changeQty(${p.id},-1)">−</button><span>${item.qty}</span><button onclick="changeQty(${p.id},1)">+</button></div>
      <button class="remove" onclick="removeItem(${p.id})">🗑</button>
    </div>`;
  }).join('');
  app.innerHTML = `<section class="section"><div class="container">
    <h2 class="section-title">سبد خرید</h2>
    <div id="cart-box">${items}
      <div class="cart-total">جمع کل: ${fmt(total)}</div>
      <button class="checkout">ثبت سفارش</button>
    </div>
  </div></section>`;
}
function changeQty(id, d) {
  const cart = getCart();
  const item = cart.find(i=>i.id===id);
  if (!item) return;
  item.qty += d;
  if (item.qty <= 0) return removeItem(id);
  saveCart(cart); renderCart();
}
function removeItem(id) { saveCart(getCart().filter(i=>i.id!==id)); renderCart(); }

function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  const app = document.getElementById('app');
  if (!q) return showPage('home');
  const list = products.filter(p => p.name.includes(q) || p.brand.toLowerCase().includes(q.toLowerCase()));
  app.innerHTML = `<section class="section"><div class="container">
    <h2 class="section-title">نتایج جستجو برای «${q}»</h2>
    <div class="product-grid">${list.length ? list.map(productCard).join('') : '<p class="empty">محصولی یافت نشد</p>'}</div>
  </div></section>`;
}

showPage('home');
</script>
</body>
</html>
